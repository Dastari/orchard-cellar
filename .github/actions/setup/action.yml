name: setup
description: Checkout-independent setup shared by the CI jobs (Node, SpaceTimeDB, ripgrep, npm ci, generated assets).
inputs:
  spacetime:
    description: Install the SpaceTimeDB CLI (only the world build needs it).
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
    - name: Install SpaceTimeDB 2.8.2
      if: inputs.spacetime == 'true'
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://install.spacetimedb.com | sh -s -- --yes
        "$HOME/.local/bin/spacetime" version install 2.8.2 --use --yes
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install test utilities
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run assets:build
