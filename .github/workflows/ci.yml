name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SpaceTimeDB 2.8.2
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.spacetimedb.com | sh
          "$HOME/.local/bin/spacetime" version install 2.8.2 --use --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
