# Nginx Proxy Manager "Advanced" fragment for cellar.dastari.net.
# The proxy host itself forwards to http://10.0.1.150:5174 with WebSocket Support
# enabled. Orchard Studio then proxies same-origin /v1 HTTP and WebSocket requests
# to the loopback-only SpaceTimeDB listener. This requires the query-free log format
# and rate/connection zones in ops/orchard-auth/npm/http_top.conf.
access_log /data/logs/orchard-studio_access.log orchard_studio;
limit_req zone=orchard_studio_dynamic_per_ip burst=120 nodelay;
limit_req_status 429;
limit_conn orchard_studio_dynamic_connections 24;
limit_conn_status 429;
proxy_hide_header Content-Security-Policy;
# NPM's generated location includes its own add_header directive, which suppresses
# inherited add_header values. headers-more applies these at the server level without
# that inheritance trap and replaces any upstream copies.
more_set_headers "Content-Security-Policy: default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; connect-src 'self' https://auth.orchard.dastari.net wss://cellar.dastari.net; form-action 'self' https://auth.orchard.dastari.net";
more_set_headers "Referrer-Policy: no-referrer";
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: DENY";
more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
more_set_headers "Cache-Control: no-store";
