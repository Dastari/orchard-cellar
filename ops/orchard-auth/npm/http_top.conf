# Orchard authentication access logs intentionally omit query strings so OIDC
# authorization codes cannot be written to NPM's proxy-host log.
log_format orchard_auth '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# Studio uses the same query-free log boundary. HAProxy terminates the public
# connection before NPM, so NPM sees its Docker gateway for every visitor.
# Exclude immutable/static asset paths from that shared bucket: HTML/API/auth
# traffic remains limited, while concurrent atlas/icon loads cannot throttle
# unrelated Studio users. Empty limit keys are not accounted by nginx.
log_format orchard_studio '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $uri $orchard_studio_client_key {
    default $binary_remote_addr;
    ~^/(?:assets|generated|ui)(?:/|$) "";
}
limit_req_zone $orchard_studio_client_key zone=orchard_studio_dynamic_per_ip:10m rate=30r/s;
limit_conn_zone $orchard_studio_client_key zone=orchard_studio_dynamic_connections:10m;
