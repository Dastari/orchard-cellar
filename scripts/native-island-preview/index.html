<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native island designs</title>
<style>
  :root{color-scheme:dark;font:15px system-ui;background:#131c22;color:#e2ebdf}body{margin:0}header{padding:20px 28px;background:#1d2c32;position:sticky;top:0;z-index:2}h1{font-size:21px;margin:0 0 10px}p{margin:8px 0;color:#b6c7bf}button,select{font:inherit;padding:8px 13px;margin:3px;border:1px solid #567068;border-radius:5px;background:#283e42;color:#edf2df;cursor:pointer}button[aria-pressed=true]{background:#637943}button:focus-visible,select:focus-visible{outline:3px solid #fbc777}main{padding:20px 28px}canvas{image-rendering:pixelated;max-width:100%;height:auto;display:block;background:#284863;border:1px solid #344a51}.note{font-size:13px;max-width:950px}#status{color:#efca93}a{color:#f0d99d}

<header><h1>Native island designs</h1><div role="group" aria-label="Island"><button id="cinderwake" aria-pressed="true">Cinderwake</button><button id="willowharbour" aria-pressed="false">Willowharbour</button></div><label>View <select id="view"><option value="overview">Full island</option></select></label><label>Lighting <select id="lighting"><option value="day">Day</option><option value="night-off">Night — emission off</option><option value="night-self">Night — lava surface only</option><option value="night-glow">Night — lava surface and light</option></select></label><button id="export">Save review images</button><button id="download">Download editable map</button><p id="status" role="status">Loading native atlas…</p></header>
<main><p class="note">Original registered tile art at native size. These are visual layout drafts; the continuous terrain slopes and traversal have not yet been implemented. The lighting views use the engine’s emissive frame cache and local light solver.</p><canvas id="scene" aria-label="Native tile island design"></canvas></main><script type="module" src="./main.ts"></script></html>
