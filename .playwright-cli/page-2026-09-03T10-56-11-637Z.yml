tNodeId\": \"about_jane\" }, { \"id\": \"farm\", \"label\": \"How do you keep this place running?\", \"nextNodeId\": \"about_farm\" }, { \"id\": \"grave\", \"label\": \"Whose grave is by the trees?\", \"nextNodeId\": \"about_grave\" }, { \"id\": \"goodbye\", \"label\": \"Goodbye.\", \"nextNodeId\": null } ] }, { \"id\": \"strawberry_request\", \"speaker\": \"Farmer Bob\", \"body\": \"Jane loves strawberries. I promised her some before supper, but the ordinary seeds take all day and she has never been patient. Take these six special packets. My farm is protected, so till clear grass elsewhere in the overworld, plant all six, then water them once. They should be ready in about thirty seconds—even in winter.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"accept\", \"label\": \"I will grow them for Jane.\", \"nextNodeId\": \"strawberry_accepted\", \"tone\": \"accept\", \"quest\": { \"quest\": \"quest:farmer_bob_fast_strawberries\", \"requires\": \"available\", \"action\": \"accept\" } }, { \"id\": \"tools\", \"label\": \"What if I need farming tools?\", \"nextNodeId\": \"strawberry_tools\" }, { \"id\": \"decline\", \"label\": \"Not just now.\", \"nextNodeId\": \"greeting\", \"tone\": \"decline\" } ] }, { \"id\": \"strawberry_tools\", \"speaker\": \"Farmer Bob\", \"body\": \"I sell hoes, shovels, watering cans, and every ordinary seed I can get into a paper packet. These special strawberry seeds are for the job, though. Jane says selling miracles by the sack would ruin the market.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"accept\", \"label\": \"All right. I will grow them.\", \"nextNodeId\": \"strawberry_accepted\", \"tone\": \"accept\", \"quest\": { \"quest\": \"quest:farmer_bob_fast_strawberries\", \"requires\": \"available\", \"action\": \"accept\" } }, { \"id\": \"shop\", \"label\": \"Show me your supplies first.\", \"nextNodeId\": \"shop\" }, { \"id\": \"back\", \"label\": \"Maybe later.\", \"nextNodeId\": \"greeting\" } ] }, { \"id\": \"strawberry_accepted\", \"speaker\": \"Farmer Bob\", \"body\": \"Good! Find clear overworld ground outside my fence, then till, plant all six, water once, and keep an eye on them. Bring me three strawberries. Jane will be delighted. She has been awfully quiet today.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"goodbye\", \"label\": \"I will be back soon.\", \"nextNodeId\": null } ] }, { \"id\": \"strawberry_reminder\", \"speaker\": \"Farmer Bob\", \"body\": \"Find clear overworld grass outside my protected farm—anywhere else on the overworld is fine. Till it with a hoe, plant all six special packets, and water once. Thirty seconds or so, in any season. Then bring three strawberries back. Do not worry if Jane does not come out to greet you. She rests a lot these days.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"shop\", \"label\": \"I need farming supplies.\", \"nextNodeId\": \"shop\" }, { \"id\": \"goodbye\", \"label\": \"I understand.\", \"nextNodeId\": null } ] }, { \"id\": \"strawberry_rewarded\", \"speaker\": \"Farmer Bob\", \"body\": \"Thanks, my wife will love these. Here was one of her favourite books on gardening. I am sure she will not mind; I have not seen her reading it much lately. It has her notes for presses, barrels, and cellar casks too.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"goodbye\", \"label\": \"Thank you, Bob.\", \"nextNodeId\": null } ] }, { \"id\": \"bottle_request\", \"speaker\": \"Farmer Bob\", \"body\": \"Jane wrote the whole chain down. Press three pieces of fruit into Must, age three Must in a Fermentation Cask, then sell the finished Bottle to Marlow. Do that and I will help mark out more room at your homestead.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"accept\", \"label\": \"I will produce a Bottle.\", \"nextNodeId\": \"bottle_accepted\", \"tone\": \"accept\", \"quest\": { \"quest\": \"quest:marlow_first_bottle\", \"requires\": \"available\", \"action\": \"accept\" } }, { \"id\": \"decline\", \"label\": \"Not yet.\", \"nextNodeId\": \"greeting\", \"tone\": \"decline\" } ] }, { \"id\": \"bottle_accepted\", \"speaker\": \"Farmer Bob\", \"body\": \"Fruit Press first, Fermentation Cask second, Marlow last. Jane underlined that last part twice. She never trusted him around an unpriced bottle.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"goodbye\", \"label\": \"Time to get to work.\", \"nextNodeId\": null } ] }, { \"id\": \"bottle_reminder\", \"speaker\": \"Farmer Bob\", \"body\": \"Press three Fruit, age the three Must into one Bottle, and sell it to Marlow. Jane's journal contains the station recipes if you read it from your inventory.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"goodbye\", \"label\": \"I remember now.\", \"nextNodeId\": null } ] }, { \"id\": \"bottle_rewarded\", \"speaker\": \"Farmer Bob\", \"body\": \"A proper first vintage! Jane would say not to drink the profits. Here is five gold for the trouble. She would have liked that too.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"goodbye\", \"label\": \"Thank you, Bob.\", \"nextNodeId\": null } ] }, { \"id\": \"about_jane\", \"speaker\": \"Farmer Bob\", \"body\": \"Best gardener on the island. She could shame a seed into sprouting. I still set out two mugs at breakfast. Habit is just love with nowhere urgent to be.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"back\", \"label\": \"I had another question.\", \"nextNodeId\": \"greeting\" }, { \"id\": \"goodbye\", \"label\": \"Take care, Bob.\", \"nextNodeId\": null } ] }, { \"id\": \"about_farm\", \"speaker\": \"Farmer Bob\", \"body\": \"Fence keeps the cows in, gate lets good sense out. I rotate the plots, water at the roots, and talk to the pumpkins. Jane says the pumpkins are the only ones listening properly.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"shop\", \"label\": \"Show me your supplies.\", \"nextNodeId\": \"shop\" }, { \"id\": \"back\", \"label\": \"I had another question.\", \"nextNodeId\": \"greeting\" } ] }, { \"id\": \"about_grave\", \"speaker\": \"Farmer Bob\", \"body\": \"Jane picked that spot herself. Said the morning sun was lovely under those trees. I keep the flowers fresh so she has something cheerful to look at while she rests.\", \"mode\": \"dialogue\", \"choices\": [ { \"id\": \"back\", \"label\": \"I had another question.\", \"nextNodeId\": \"greeting\" }, { \"id\": \"goodbye\", \"label\": \"Goodbye, Bob.\", \"nextNodeId\": null } ] }, { \"id\": \"shop\", \"speaker\": \"Farmer Bob\", \"body\": \"Seeds in dry packets, tools by the handle. Jane did the labels. Mine always looked like frightened worms.\", \"mode\": \"shop\", \"choices\": [ { \"id\": \"back\", \"label\": \"Back to our conversation.\", \"nextNodeId\": \"greeting\" }, { \"id\": \"goodbye\", \"label\": \"Goodbye.\", \"nextNodeId\": null } ] } ] }"
