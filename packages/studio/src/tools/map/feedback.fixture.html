<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Studio local feedback fixture</title>
<style>html,body { margin:0;width:100%;height:100%;overflow:hidden } canvas {width:100%;height:100%;display:block;image-rendering:pixelated}</style>
<canvas id="studio"></canvas>
<script type="module">
import { StudioShellApp, StudioShellController, defaultStudioCanvasToolRegistry, registerBuiltinStudioCanvasTools } from '../../shell/index.ts';
if (!import.meta.env.DEV) throw new Error('Development fixture only');
registerBuiltinStudioCanvasTools(defaultStudioCanvasToolRegistry);
let app;
const controller=new StudioShellController(async()=>{throw new Error('Fixture cannot connect or publish')},null,()=>app?.render());
app=new StudioShellApp(document.querySelector('canvas'),controller);
app.mount();controller.navigate('/build/map/terrain-lab');app.render();
window.fixture={app,controller};
</script>
