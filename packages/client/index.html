  <body>
    <main id="game-shell" aria-busy="true">
      <canvas id="game" width="480" height="270" aria-label="Orchard and Cellar"></canvas>
      <input id="account-name" class="canvas-input" maxlength="20" autocomplete="nickname" aria-label="New local development profile name" />
      <input id="character-name" class="canvas-input" maxlength="20" autocomplete="off" aria-label="Character name" hidden />
      <input id="shop-filter" class="canvas-input" maxlength="32" autocomplete="off" aria-label="Filter Marlow's shop items" hidden />
      <input id="inventory-filter" class="canvas-input" maxlength="32" autocomplete="off" aria-label="Filter inventory items" hidden />
      <input id="trade-money-gold" class="canvas-input" inputmode="numeric" pattern="[0-9]*" maxlength="16" autocomplete="off" aria-label="Gold to offer in trade" hidden />
      <input id="trade-money-silver" class="canvas-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Silver to offer in trade" hidden />
      <input id="trade-money-bronze" class="canvas-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" aria-label="Bronze to offer in trade" hidden />
      <section id="loading-screen" class="loading-status" role="status" aria-live="polite" aria-label="Opening the Orchard. 8%">
        <span id="loading-title">OPENING THE ORCHARD</span>
        <span id="loading-detail">CHECKING YOUR ACCOUNT</span>
        <span id="loading-progress">8%</span>
      </section>
      <section id="pwa-update-status" class="loading-status" role="status" aria-live="assertive"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
